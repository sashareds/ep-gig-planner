name: Refresh lineup

# Every 3 hours, plus a manual button in the Actions tab.
# Does not call Discogs. New acts keep Clashfinder blurbs until a local media crawl.
on:
  schedule:
    - cron: "20 */3 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-lineup
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Clashfinder dump
        env:
          CLASHFINDER_USER: ${{ secrets.CLASHFINDER_USER }}
          CLASHFINDER_PUBLIC_KEY: ${{ secrets.CLASHFINDER_PUBLIC_KEY }}
        run: ./scripts/fetch-ep26.sh

      - name: Test
        run: python3 -m pip install --quiet pytest && python3 -m pytest tests/test_normalize.py

      - name: Commit and push if the lineup changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ep26.json data/ep26.js data/ep26-acts.json
          if git diff --cached --quiet; then
            echo "No lineup change"
            exit 0
          fi
          git commit -m "Refresh EP26 lineup from Clashfinder"
          git pull --rebase origin main
          git push
